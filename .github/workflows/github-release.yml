name: GitHub APK Only

# Mirrors the `github-release` workflow in codemagic.yaml. Triggered manually via
# `gh workflow run github-release.yml` or the Actions UI. Builds the
# github-flavor APKs plus four GMS-free companions from the fdroid flavor
# (universal and per-ABI splits, with Chromecast and store review swapped for
# their no-op stubs), renames them with the pubspec version, and uploads them to
# the GitHub draft release for that version.
#
# Signing: the upload keystore is stored as a base64 secret
# (ANDROID_KEYSTORE_BASE64) and decoded into a temp file at build time.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release? Uploads to a per-build v<version>-<build> tag, marks it prerelease, adds -pre to the filename"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build APK, publish to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Allow GITHUB_TOKEN to create/upload to GitHub Releases.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read pubspec version
        id: version
        env:
          PRE: ${{ inputs.prerelease }}
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION_NAME="${RAW%%+*}"
          BUILD="${RAW##*+}"
          # Unified artifact basename: dash (URL-safe, unlike +) between version
          # and build number, plus a -pre suffix for prereleases.
          BASE="absorb-${RAW//+/-}"
          if [ "$PRE" = "true" ]; then
            # Per-build tag: Obtainium and the in-app updater key on the tag,
            # so each beta build needs its own. Finals keep the clean tag,
            # which is also the only shape F-Droid's checkupdates matches.
            echo "tag=v${VERSION_NAME}-${BUILD}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}" >> "$GITHUB_OUTPUT"
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"

      - name: Notify Discord (build started)
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.raw }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Build started\",\"description\":\"**GitHub APK Only** v$VERSION\\n[Build log]($RUN_URL)\",\"color\":3447003}]}" \
            > /dev/null 2>&1 || true

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/absorb-upload-key.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/absorb-upload-key.jks
          EOF

      - name: Build universal and split GitHub APKs
        run: bash scripts/build-github-apks

      - name: Mark prerelease APK names
        env:
          PRE: ${{ steps.version.outputs.pre }}
        run: |
          if [ "$PRE" = "true" ]; then
            for apk in build/app/outputs/apk/github/release/*.apk; do
              mv "$apk" "${apk%.apk}-pre.apk"
            done
          fi

      - name: Build GMS-free APKs (fdroid flavor)
        run: |
          # The F-Droid prebuild substitutions (fdroid/com.barnabas.absorb.yml),
          # extended with review_service: cast and review become their no-op stubs
          # and the two Google Play Services plugins leave pubspec, so nothing
          # proprietary is linked (the fdroid source set carries no GMS Kotlin and
          # its manifest overlay drops the cast / Auto / Wear components).
          cp lib/services/chromecast_service_stub.dart lib/services/chromecast_service.dart
          cp lib/widgets/chromecast_button_stub.dart lib/widgets/chromecast_button.dart
          cp lib/services/review_service_stub.dart lib/services/review_service.dart
          sed -i '/^  flutter_chrome_cast:/{N;d}' pubspec.yaml
          sed -i '/^  in_app_review:/d' pubspec.yaml
          if grep -qE 'flutter_chrome_cast|in_app_review' pubspec.yaml; then
            echo 'a Google Play Services plugin is still declared in pubspec'
            exit 1
          fi
          flutter pub get
          # Universal first, then the per-ABI splits; Flutter emits only one
          # shape per invocation.
          flutter build apk --release --flavor fdroid
          flutter build apk --release --flavor fdroid --split-per-abi

      - name: Stage fdroid APKs
        env:
          FNAME: ${{ steps.version.outputs.fname }}
        run: |
          mkdir -p "$RUNNER_TEMP/fdroid"
          # ELF architecture names instead of the Android ones on purpose: the
          # in-app updater picks a release asset by `universal` / `arm64-v8a` /
          # `armeabi-v7a` / `x86_64` filename tokens, and it must never offer
          # this build to someone on the Google-services flavor.
          mv build/app/outputs/flutter-apk/app-fdroid-release.apk \
            "$RUNNER_TEMP/fdroid/${FNAME}-fdroid-all.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk \
            "$RUNNER_TEMP/fdroid/${FNAME}-fdroid-aarch64.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk \
            "$RUNNER_TEMP/fdroid/${FNAME}-fdroid-armv7.apk"
          mv build/app/outputs/flutter-apk/app-x86_64-fdroid-release.apk \
            "$RUNNER_TEMP/fdroid/${FNAME}-fdroid-amd64.apk"
          ls -l "$RUNNER_TEMP/fdroid"

      - name: Upload APK to GitHub draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.pre }}
        run: |
          shopt -s nullglob
          UNIVERSAL=(build/app/outputs/apk/github/release/*-universal*.apk)
          ALL_APKS=(build/app/outputs/apk/github/release/*.apk)
          [ "${#UNIVERSAL[@]}" -eq 1 ] || { echo "Universal APK missing"; exit 1; }
          if gh release view "$VERSION_TAG" &>/dev/null; then
            gh release upload "$VERSION_TAG" "${UNIVERSAL[0]}" --clobber
          else
            CREATE_ARGS=(--draft --title "$VERSION_TAG")
            [ "$PRE" = "true" ] && CREATE_ARGS+=(--prerelease)
            gh release create "$VERSION_TAG" "${UNIVERSAL[0]}" "${CREATE_ARGS[@]}"
          fi
          for apk in "${ALL_APKS[@]}"; do
            [ "$apk" = "${UNIVERSAL[0]}" ] && continue
            gh release upload "$VERSION_TAG" "$apk" --clobber
          done
          # Last, so a release reader that takes the first .apk it finds still
          # lands on a Google-services build.
          gh release upload "$VERSION_TAG" "$RUNNER_TEMP"/fdroid/*.apk --clobber

      - name: Notify Discord (build finished)
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.raw }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            TITLE="Build successful"
            COLOR=3066993
          else
            TITLE="Build failed"
            COLOR=15158332
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"**GitHub APK Only** v$VERSION\\n[Build log]($RUN_URL)\",\"color\":$COLOR}]}" \
            > /dev/null 2>&1 || true